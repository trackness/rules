[project]
name = "rules"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["plugins/rules", "plugins/agent-row"]
# Each script's tests sit beside it, as test_rule.py beside rule.py, and importlib mode imports each under a name built
# from its path, so the same file names don't collide and each test can import its own script relatively, as .rule.
addopts = ["--import-mode=importlib"]
