[project]
name = "rules"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["plugins/rules"]
# Every rule's tests are test_rule.py beside its rule.py, and importlib mode imports each under a name built from its
# path, so the same file names don't collide and each test can import its own rule as .rule.
addopts = ["--import-mode=importlib"]
